<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Turn any lecture recording into notes, flashcards and searchable timestamps — entirely in your browser."
    />
    <title>Lecture Notes AI</title>
    <script>
      // Apply the saved theme before first paint (no light flash in dark mode).
      try {
        var t = JSON.parse(localStorage.getItem("lna.settings") || "{}").theme;
        var dark =
          t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
